name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:
  # Allow this workflow to be called as a reusable workflow from release.yml
  workflow_call:
    secrets:
      SIGNING_KEY_BASE64:
        required: false
      KEY_ALIAS:
        required: false
      KEY_STORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: AURIGA

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('AURIGA/**/*.gradle*', 'AURIGA/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Model downloads: all three models must be in assets before Gradle runs ──
      # Models are gitignored (large binary blobs) so CI must download/export them.
      # YOLOv8n  — required, exported from Ultralytics
      # Qwen     — required, bundled in APK so assistant works immediately on install
      # Gemma    — optional, bundled if HF_TOKEN available; else downloaded at runtime
      - name: Set up Python for model preparation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache YOLOv8n model
        id: yolo-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/yolov8n_float32.tflite
          key: yolov8n-tflite-fp32-v1

      - name: Cache Qwen model
        id: qwen-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/qwen2_5_0_5b_q8.bin
          key: qwen-2_5-0_5b-q8-v1

      - name: Cache Gemma model
        id: gemma-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/gemma2b_q4.bin
          key: gemma2-2b-it-q8-v1

      - name: Install Python dependencies
        run: pip install --quiet ultralytics huggingface_hub

      - name: Export YOLOv8n TFLite model
        if: steps.yolo-cache.outputs.cache-hit != 'true'
        run: |
          DEST="AURIGA/app/src/main/assets/yolov8n_float32.tflite"
          yolo export model=yolov8n.pt format=tflite imgsz=640 --quiet
          SRC=$(find yolov8n_saved_model -name "yolov8n_float32.tflite" | head -1)
          [ -n "$SRC" ] || { echo "::error::YOLOv8n export failed"; exit 1; }
          cp "$SRC" "$DEST"
          echo "YOLOv8n: $(du -sh $DEST | cut -f1)"

      - name: Download Qwen 2.5 0.5B (bundled — no auth needed)
        if: steps.qwen-cache.outputs.cache-hit != 'true'
        run: |
          python3 - <<'EOF'
          import os, sys, shutil
          try:
            from huggingface_hub import hf_hub_download
            path = hf_hub_download(
              repo_id="litert-community/Qwen2.5-0.5B-Instruct",
              filename="Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.tflite",
              local_dir="/tmp/qwen"
            )
            dest = "AURIGA/app/src/main/assets/qwen2_5_0_5b_q8.bin"
            shutil.copy(path, dest)
            print(f"Qwen ready: {os.path.getsize(dest):,} bytes")
          except Exception as e:
            print(f"ERROR: {e}", file=sys.stderr); sys.exit(1)
          EOF

      - name: Download Gemma 2 2B IT (optional — requires HF_TOKEN)
        if: steps.gemma-cache.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::warning::HF_TOKEN not set — Gemma skipped (app downloads at runtime)"; exit 0; }
          python3 - <<'EOF'
          import os, sys, shutil
          try:
            from huggingface_hub import login, hf_hub_download
            login(token=os.environ["HF_TOKEN"], add_to_git_credential=False)
            path = hf_hub_download(
              repo_id="litert-community/Gemma2-2B-IT",
              filename="Gemma2-2B-IT_multi-prefill-seq_q8_ekv1280.tflite",
              local_dir="/tmp/gemma"
            )
            dest = "AURIGA/app/src/main/assets/gemma2b_q4.bin"
            shutil.copy(path, dest)
            print(f"Gemma ready: {os.path.getsize(dest):,} bytes")
          except Exception as e:
            print(f"Gemma download failed (non-fatal): {e}", file=sys.stderr); sys.exit(0)
          EOF

      - name: Verify required models
        run: |
          ASSETS="AURIGA/app/src/main/assets"
          FAIL=false
          for req in yolov8n_float32.tflite qwen2_5_0_5b_q8.bin; do
            f="$ASSETS/$req"
            if [ -f "$f" ]; then echo "OK  $req ($(du -sh $f | cut -f1))"
            else echo "::error::MISSING $req"; FAIL=true; fi
          done
          for opt in gemma2b_q4.bin; do
            f="$ASSETS/$opt"
            if [ -f "$f" ]; then echo "OK  $opt ($(du -sh $f | cut -f1))"
            else echo "::warning::OPTIONAL $opt not bundled — runtime download via ModelDownloadManager"; fi
          done
          [ "$FAIL" = "false" ] || exit 1

      # Build all four product-flavor debug APKs.
      # In a project with product flavors, 'assembleDebug' assembles all
      # flavors' debug variants — output lands in apk/{flavor}/debug/.
      - name: Build Debug APKs (all flavors)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: AURIGA

      # Build all four product-flavor release APKs (signed with debug key
      # as fallback when no release keystore secret is present).
      # Output lands in app/build/outputs/apk/{flavor}/release/.
      - name: Build Release APKs (all flavors)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: AURIGA

      - name: Sign Release APKs (production keystore)
        if: github.event_name == 'release' && secrets.SIGNING_KEY_BASE64 != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: AURIGA/app/build/outputs/apk/navi/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename navi debug APK with version + commit
        run: |
          VERSION=$(grep 'versionName' AURIGA/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "dev")
          COMMIT=$(echo $GITHUB_SHA | cut -c1-7)
          SRC=$(find AURIGA/app/build/outputs/apk/navi/debug -name "*.apk" | head -1)
          if [ -n "$SRC" ]; then
            DIR=$(dirname "$SRC")
            cp "$SRC" "$DIR/AurigaNavi-${VERSION}-${COMMIT}-debug.apk" || true
          fi

      - name: Upload Debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AurigaNavi-debug
          path: AURIGA/app/build/outputs/apk/**/debug/*.apk
          retention-days: 30

      - name: Upload Release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AurigaNavi-release
          path: AURIGA/app/build/outputs/apk/**/release/*.apk
          retention-days: 30

      - name: Upload APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AURIGA/app/build/outputs/apk/**/debug/*.apk
            AURIGA/app/build/outputs/apk/**/release/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK outputs" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          find AURIGA/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            size=$(du -h "$f" | cut -f1)
            name=$(basename "$f")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done || true
