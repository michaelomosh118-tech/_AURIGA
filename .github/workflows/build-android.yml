name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: AURIGA

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('AURIGA/**/*.gradle*', 'AURIGA/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: AURIGA

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: AURIGA

      - name: Sign Release APK
        if: github.event_name == 'release' && secrets.SIGNING_KEY_BASE64 != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: AURIGA/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK with version
        run: |
          VERSION=$(grep versionName AURIGA/app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/' || echo "dev")
          COMMIT=$(echo $GITHUB_SHA | cut -c1-7)
          cp AURIGA/app/build/outputs/apk/debug/app-debug.apk \
             AURIGA/app/build/outputs/apk/debug/AurigaNavi-${VERSION}-${COMMIT}-debug.apk || true

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurigaNavi-debug
          path: AURIGA/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AurigaNavi-release-unsigned
          path: AURIGA/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload APKs to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AURIGA/app/build/outputs/apk/debug/*.apk
            AURIGA/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f AURIGA/app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(du -h AURIGA/app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "| Debug APK size | $SIZE |" >> $GITHUB_STEP_SUMMARY
          fi
