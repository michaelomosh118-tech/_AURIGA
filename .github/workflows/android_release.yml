name: AURIGA Release Publisher

# Fires on a semver tag push (v1.2.3, v1.2.3-rc1, etc.). Builds all four
# product flavors in release mode (APK + AAB) and uploads them as a single
# GitHub Release so the landing page's "DIRECT DOWNLOAD" button always
# resolves to the newest signed artifact without any site redeploy.
#
# The stable URL the website consumes is:
#   https://github.com/<owner>/<repo>/releases/latest/download/AurigaNavi-release.apk
# (and similarly for Sentinel / Aero / Industrial.)
#
# Signing behaviour:
#   - If the AURIGA_RELEASE_KEYSTORE_B64 + friends secrets are populated,
#     the APK/AAB is signed with the production keystore.
#   - Otherwise it falls back to the committed debug keystore so a release
#     can still be cut end-to-end during bootstrap. A warning is logged so
#     you don't accidentally ship a debug-keyed artifact to users forever.
#
# Model bundling:
#   - YOLOv8n (~12 MB)  : always bundled — exported from Ultralytics on runner.
#   - Qwen 0.5B (~519 MB): always bundled — Apache-2.0, no auth needed.
#   - Gemma 2B (~2.52 GB): bundled only when HF_TOKEN secret is set AND the
#     licence is accepted at huggingface.co/litert-community/Gemma2-2B-IT.
#     Without it the APK ships with Qwen only; ModelDownloadManager offers
#     a runtime Gemma download at first launch. A raw APK with Gemma exceeds
#     2 GB — for Play Store delivery use AAB + Play Asset Delivery.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0-manual'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        flavor: [ navi, sentinel, aero, industrial ]

    outputs:
      release_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Python is always needed — YOLO export uses ultralytics,
      # Qwen/Gemma downloads use huggingface_hub.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          # numpy<2 required — TensorFlow/Keras TFLite exporter calls
          # numpy._no_nep50_warning which was removed in numpy 2.x.
          pip install --quiet --no-cache-dir "numpy<2" ultralytics huggingface_hub

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Locate Android Project Root
        id: locate
        run: |
          PROJECT_ROOT="AURIGA"
          if [ ! -f "${PROJECT_ROOT}/gradlew" ] || [ ! -f "${PROJECT_ROOT}/build.gradle" ]; then
            echo "::error::Android project not found at expected path: ${PROJECT_ROOT}"
            exit 1
          fi
          echo "Android project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore (if provided)
        id: keystore
        env:
          AURIGA_RELEASE_KEYSTORE_B64: ${{ secrets.AURIGA_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "${AURIGA_RELEASE_KEYSTORE_B64:-}" ]; then
            KEYSTORE_PATH="$(cd "${{ steps.locate.outputs.project_root }}" && pwd)/release-key.jks"
            echo "$AURIGA_RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
            echo "Decoded production release keystore to $KEYSTORE_PATH"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No AURIGA_RELEASE_KEYSTORE_B64 secret set — release build will fall back to the committed debug keystore. Set production secrets before public distribution."
          fi

      - name: Compute capitalised flavor name
        id: flavor
        run: |
          F="${{ matrix.flavor }}"
          CAP="$(echo "${F:0:1}" | tr '[:lower:]' '[:upper:]')${F:1}"
          echo "cap=$CAP" >> "$GITHUB_OUTPUT"

      # ── Phase 1: YOLOv8n Object Locator (~12 MB) ──────────────────
      # Exported from Ultralytics on the runner. Cached across runs so
      # subsequent tag pushes skip the pip install + export entirely.
      # Cache key bump: -v1 → -v2 to force a fresh export.
      - name: Restore cached YOLOv8n TFLite model
        id: yolo-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.locate.outputs.project_root }}/app/src/main/assets/yolov8n_float32.tflite
          key: yolov8n-tflite-fp32-v1

      - name: Export YOLOv8n model (cache miss only)
        if: steps.yolo-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          echo "::group::Export yolov8n.pt → TFLite (640x640 fp32)"
          yolo export model=yolov8n.pt format=tflite imgsz=640
          echo "::endgroup::"
          DEST="${{ github.workspace }}/${{ steps.locate.outputs.project_root }}/app/src/main/assets/yolov8n_float32.tflite"
          mkdir -p "$(dirname "$DEST")"
          SRC=$(find yolov8n_saved_model -name "yolov8n_float32.tflite" | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::Ultralytics export did not produce yolov8n_float32.tflite"
            ls -laR yolov8n_saved_model || true
            exit 1
          fi
          cp "$SRC" "$DEST"
          echo "Exported model copied to: $DEST"

      - name: Verify YOLOv8n model is bundled
        run: |
          DEST="${{ steps.locate.outputs.project_root }}/app/src/main/assets/yolov8n_float32.tflite"
          [ -f "$DEST" ] || { echo "::error::YOLOv8n missing at $DEST after fetch step"; exit 1; }
          echo "YOLOv8n OK: $(du -sh $DEST | cut -f1)"

      # ── Phase 2: Qwen 2.5 0.5B (~519 MB, Apache-2.0) ─────────────
      # Always bundled. No auth token required. Provides full AI
      # assistant functionality immediately on install, offline.
      - name: Restore cached Qwen 2.5 0.5B model
        id: qwen-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.locate.outputs.project_root }}/app/src/main/assets/qwen2_5_0_5b_q8.bin
          key: qwen-2_5-0_5b-q8-v1

      - name: Download Qwen 2.5 0.5B (cache miss only)
        if: steps.qwen-cache.outputs.cache-hit != 'true'
        env:
          DEST: ${{ steps.locate.outputs.project_root }}/app/src/main/assets/qwen2_5_0_5b_q8.bin
        run: |
          echo "Downloading Qwen 2.5 0.5B (~519 MB)..."
          python3 - <<'EOF'
          import os, sys, shutil
          try:
            from huggingface_hub import hf_hub_download
            path = hf_hub_download(
              repo_id="litert-community/Qwen2.5-0.5B-Instruct",
              filename="Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.tflite",
              local_dir="/tmp/qwen"
            )
            dest = os.environ["DEST"]
            shutil.copy(path, dest)
            print(f"Qwen saved: {os.path.getsize(dest):,} bytes")
          except Exception as e:
            print(f"ERROR: {e}", file=sys.stderr)
            sys.exit(1)
          EOF

      - name: Verify Qwen model is bundled
        run: |
          f="${{ steps.locate.outputs.project_root }}/app/src/main/assets/qwen2_5_0_5b_q8.bin"
          [ -f "$f" ] || { echo "::error::Qwen model missing — AI assistant will be unavailable in this release"; exit 1; }
          echo "Qwen OK: $(du -sh $f | cut -f1)"

      # ── Phase 3: Gemma 2 2B IT (~2.52 GB, optional) ───────────────
      # Requires HF_TOKEN secret + licence accepted at:
      #   huggingface.co/litert-community/Gemma2-2B-IT
      # If absent this step is skipped. The APK ships with Qwen only
      # and ModelDownloadManager offers a Gemma runtime download.
      # IMPORTANT: bundling Gemma produces an APK >2.5 GB which exceeds
      # the GitHub Release 2 GB artifact limit and cannot be submitted
      # to Play Store as a raw APK — use AAB + Play Asset Delivery.
      - name: Restore cached Gemma 2 2B IT model
        id: gemma-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.locate.outputs.project_root }}/app/src/main/assets/gemma2b_q4.bin
          key: gemma2-2b-it-q8-v1

      - name: Download Gemma 2 2B IT (cache miss + token available)
        if: steps.gemma-cache.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DEST: ${{ steps.locate.outputs.project_root }}/app/src/main/assets/gemma2b_q4.bin
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::warning::HF_TOKEN not set — Gemma 2B will not be pre-bundled in this release. Add HF_TOKEN secret + accept the Gemma licence at huggingface.co/litert-community/Gemma2-2B-IT to enable."
            exit 0
          fi
          echo "Downloading Gemma 2 2B IT (~2.52 GB)..."
          python3 - <<'EOF'
          import os, sys, shutil
          try:
            from huggingface_hub import login, hf_hub_download
            token = os.environ["HF_TOKEN"]
            login(token=token, add_to_git_credential=False)
            path = hf_hub_download(
              repo_id="litert-community/Gemma2-2B-IT",
              filename="Gemma2-2B-IT_multi-prefill-seq_q8_ekv1280.tflite",
              local_dir="/tmp/gemma"
            )
            dest = os.environ["DEST"]
            shutil.copy(path, dest)
            print(f"Gemma saved: {os.path.getsize(dest):,} bytes")
          except Exception as e:
            print(f"Gemma download failed (non-fatal): {e}", file=sys.stderr)
            sys.exit(0)
          EOF

      - name: Report Gemma bundle status
        run: |
          f="${{ steps.locate.outputs.project_root }}/app/src/main/assets/gemma2b_q4.bin"
          if [ -f "$f" ]; then
            echo "Gemma OK: $(du -sh $f | cut -f1) — pre-bundled in release APK/AAB"
          else
            echo "Gemma not bundled — ModelDownloadManager will offer runtime download on first launch"
          fi

      # ── Phase 4: Model inventory ───────────────────────────────────
      - name: Model inventory
        run: |
          echo "── Model inventory ─────────────────────────────────────"
          ASSETS="${{ steps.locate.outputs.project_root }}/app/src/main/assets"
          for f in "$ASSETS/yolov8n_float32.tflite" \
                   "$ASSETS/qwen2_5_0_5b_q8.bin"     \
                   "$ASSETS/gemma2b_q4.bin"; do
            name=$(basename "$f")
            if [ -f "$f" ]; then
              echo "  BUNDLED   $name  ($(du -sh $f | cut -f1))"
            else
              echo "  MISSING   $name"
            fi
          done

      # ── Phase 5: Build ─────────────────────────────────────────────
      - name: Assemble ${{ matrix.flavor }} release (APK + AAB)
        working-directory: ${{ steps.locate.outputs.project_root }}
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.AURIGA_RELEASE_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.AURIGA_RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.AURIGA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            "assemble${{ steps.flavor.outputs.cap }}Release" \
            "bundle${{ steps.flavor.outputs.cap }}Release"

      - name: Stage release artifacts with friendly names
        id: stage
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: |
          mkdir -p ../_release_out
          F="${{ matrix.flavor }}"
          CAP="${{ steps.flavor.outputs.cap }}"
          APK_SRC=$(find "app/build/outputs/apk/${F}/release" -name "*.apk" | head -n 1)
          AAB_SRC=$(find "app/build/outputs/bundle/${F}Release" -name "*.aab" | head -n 1)
          APK_DST="../_release_out/Auriga${CAP}-release.apk"
          AAB_DST="../_release_out/Auriga${CAP}-release.aab"
          cp "$APK_SRC" "$APK_DST"
          cp "$AAB_SRC" "$AAB_DST"
          ls -la ../_release_out/

      - name: Verify APK signing
        working-directory: ${{ steps.locate.outputs.project_root }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          CAP="${{ steps.flavor.outputs.cap }}"
          "$BUILD_TOOLS/apksigner" verify --verbose "../_release_out/Auriga${CAP}-release.apk"

      - name: Upload staged artifacts for release job
        uses: actions/upload-artifact@v4
        with:
          name: auriga-release-${{ matrix.flavor }}
          path: _release_out/*
          retention-days: 30
          if-no-files-found: error

      # ── Phase 6: Build summary ─────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## AURIGA ${{ steps.flavor.outputs.cap }} Release — ${{ steps.tag.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundled models" >> $GITHUB_STEP_SUMMARY
          echo "| Model | Status | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|------|" >> $GITHUB_STEP_SUMMARY
          ASSETS="${{ steps.locate.outputs.project_root }}/app/src/main/assets"
          for f in "$ASSETS/yolov8n_float32.tflite" "$ASSETS/qwen2_5_0_5b_q8.bin" "$ASSETS/gemma2b_q4.bin"; do
            name=$(basename "$f")
            if [ -f "$f" ]; then
              size=$(du -sh "$f" | cut -f1)
              echo "| $name | ✅ bundled | $size |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | ⚠️ not bundled | — |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          find _release_out -type f 2>/dev/null | while read f; do
            echo "| $(basename $f) | $(du -h $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          done || true

  publish:
    needs: build-and-publish
    runs-on: ubuntu-latest
    env:
      HAS_MIRROR_TOKEN: ${{ secrets.AURIGA_PUBLIC_RELEASES_TOKEN != '' }}
    steps:
      - name: Download all flavor artifacts
        uses: actions/download-artifact@v4
        with:
          path: _release_in

      - name: Flatten download tree
        run: |
          mkdir -p _release_final
          find _release_in -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} _release_final/ \;
          ls -la _release_final/

      - name: Publish GitHub Release (private _AURIGA)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-publish.outputs.release_tag }}
          name: Auriga ${{ needs.build-and-publish.outputs.release_tag }}
          generate_release_notes: true
          files: |
            _release_final/AurigaNavi-release.apk
            _release_final/AurigaSentinel-release.apk
            _release_final/AurigaAero-release.apk
            _release_final/AurigaIndustrial-release.apk
            _release_final/AurigaNavi-release.aab
            _release_final/AurigaSentinel-release.aab
            _release_final/AurigaAero-release.aab
            _release_final/AurigaIndustrial-release.aab

      - name: Diagnose mirror PAT
        if: ${{ env.HAS_MIRROR_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AURIGA_PUBLIC_RELEASES_TOKEN }}
        run: |
          set +e
          echo "PAT authenticates as: $(gh api user --jq .login 2>&1 | tail -1)"
          echo "Token scopes (classic PATs only):"
          curl -sSI -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user \
            | grep -i '^x-oauth-scopes' || echo "  (fine-grained PAT — scopes header is absent)"
          echo "auriga-releases repo visibility + our permission set:"
          gh api repos/michaelomosh118-tech/auriga-releases --jq '{private, permissions}' 2>&1 || true
          set -e

      - name: Mirror release to public auriga-releases repo
        if: ${{ env.HAS_MIRROR_TOKEN == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: michaelomosh118-tech/auriga-releases
          token: ${{ secrets.AURIGA_PUBLIC_RELEASES_TOKEN }}
          tag_name: ${{ needs.build-and-publish.outputs.release_tag }}
          name: Auriga ${{ needs.build-and-publish.outputs.release_tag }}
          body: "Public mirror of michaelomosh118-tech/_AURIGA@${{ needs.build-and-publish.outputs.release_tag }}. APKs signed v1+v2+v3."
          target_commitish: main
          overwrite_files: true
          files: |
            _release_final/AurigaNavi-release.apk
            _release_final/AurigaSentinel-release.apk
            _release_final/AurigaAero-release.apk
            _release_final/AurigaIndustrial-release.apk
            _release_final/AurigaNavi-release.aab
            _release_final/AurigaSentinel-release.aab
            _release_final/AurigaAero-release.aab
            _release_final/AurigaIndustrial-release.aab

      - name: Warn if public mirror token is missing
        if: ${{ env.HAS_MIRROR_TOKEN != 'true' }}
        run: |
          echo "::warning::AURIGA_PUBLIC_RELEASES_TOKEN secret not set — this tag was NOT mirrored to the public auriga-releases repo. Add the secret (PAT with public_repo scope) to enable automatic mirroring."
