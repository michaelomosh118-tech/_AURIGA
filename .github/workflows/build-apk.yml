name: Build Auriga APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Python (model downloads + YOLOv8n export) ───────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Cache pip packages ──────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ultralytics-hf-${{ runner.os }}-v2

      # ── 5. Cache model files (keyed by content hashes) ─────────────
      - name: Cache YOLOv8n model
        id: yolo-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/yolov8n_float32.tflite
          key: yolov8n-tflite-fp32-v1

      - name: Cache Qwen model
        id: qwen-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/qwen2_5_0_5b_q8.bin
          key: qwen-2_5-0_5b-q8-v1

      - name: Cache Qwen 2.5 1.5B model
        id: qwen-large-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/qwen2_5_1_5b_q8.bin
          key: qwen-2_5-1_5b-q8-v1

      # ── 6. Install Python deps ─────────────────────────────────────
      - name: Install Python dependencies
        run: pip install ultralytics huggingface_hub --quiet

      # ── 7. Export YOLOv8n (required) ──────────────────────────────
      - name: Export YOLOv8n TFLite model
        if: steps.yolo-cache.outputs.cache-hit != 'true'
        run: |
          DEST="AURIGA/app/src/main/assets/yolov8n_float32.tflite"
          echo "Exporting YOLOv8n to TFLite..."
          yolo export model=yolov8n.pt format=tflite imgsz=640 --quiet
          SRC=$(find yolov8n_saved_model -name "yolov8n_float32.tflite" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::YOLOv8n export failed — tflite not found"
            exit 1
          fi
          cp "$SRC" "$DEST"
          echo "YOLOv8n ready: $(du -sh $DEST | cut -f1)"

      - name: Verify YOLOv8n
        run: |
          f="AURIGA/app/src/main/assets/yolov8n_float32.tflite"
          [ -f "$f" ] || { echo "::error::YOLOv8n missing"; exit 1; }
          echo "YOLOv8n OK: $(du -sh $f | cut -f1)"

      # ── 8. Download Qwen 2.5 0.5B (required — bundled in APK) ─────
      # Apache-2.0, no auth token needed. Pre-bundled so the assistant
      # works immediately on install with no network required.
      - name: Download Qwen 2.5 0.5B
        if: steps.qwen-cache.outputs.cache-hit != 'true'
        run: |
          DEST="AURIGA/app/src/main/assets/qwen2_5_0_5b_q8.bin"
          echo "Downloading Qwen 2.5 0.5B (519 MB)..."
          python3 - <<'EOF'
          import os, sys
          try:
            from huggingface_hub import hf_hub_download
            path = hf_hub_download(
              repo_id="litert-community/Qwen2.5-0.5B-Instruct",
              filename="Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.tflite",
              local_dir="/tmp/qwen"
            )
            dest = "AURIGA/app/src/main/assets/qwen2_5_0_5b_q8.bin"
            import shutil; shutil.copy(path, dest)
            print(f"Qwen saved: {os.path.getsize(dest):,} bytes")
          except Exception as e:
            print(f"ERROR: {e}", file=sys.stderr)
            sys.exit(1)
          EOF

      - name: Verify Qwen
        run: |
          f="AURIGA/app/src/main/assets/qwen2_5_0_5b_q8.bin"
          [ -f "$f" ] || { echo "::error::Qwen model missing — cannot build AI-capable APK"; exit 1; }
          echo "Qwen OK: $(du -sh $f | cut -f1)"

      # ── 9. Download Qwen 2.5 1.5B (required — bundled in APK) ───────
      # Apache-2.0, no auth token needed. ~800 MB. Used on devices with
      # ≥3 GB RAM; Qwen 0.5B is the automatic fallback below that.
      # NOTE: litert-community only ships q8 for the 1.5B model (no q4).
      - name: Download Qwen 2.5 1.5B
        if: steps.qwen-large-cache.outputs.cache-hit != 'true'
        run: |
          DEST="AURIGA/app/src/main/assets/qwen2_5_1_5b_q8.bin"
          echo "Downloading Qwen 2.5 1.5B (~800 MB)..."
          python3 - <<'EOF'
          import os, sys
          try:
            from huggingface_hub import hf_hub_download
            path = hf_hub_download(
              repo_id="litert-community/Qwen2.5-1.5B-Instruct",
              filename="Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv1280.tflite",
              local_dir="/tmp/qwen_large"
            )
            dest = "AURIGA/app/src/main/assets/qwen2_5_1_5b_q8.bin"
            import shutil; shutil.copy(path, dest)
            print(f"Qwen 1.5B saved: {os.path.getsize(dest):,} bytes")
          except Exception as e:
            print(f"ERROR: {e}", file=sys.stderr)
            sys.exit(1)
          EOF

      - name: Verify Qwen 1.5B
        run: |
          f="AURIGA/app/src/main/assets/qwen2_5_1_5b_q8.bin"
          [ -f "$f" ] || { echo "::error::Qwen 1.5B missing — cannot build AI-capable APK"; exit 1; }
          echo "Qwen 1.5B OK: $(du -sh $f | cut -f1)"

      # ── 10. Model inventory summary ───────────────────────────────
      - name: Model inventory
        run: |
          echo "── Final model inventory ──────────────────────────────"
          ASSETS="AURIGA/app/src/main/assets"
          for f in "$ASSETS/yolov8n_float32.tflite" \
                   "$ASSETS/qwen2_5_0_5b_q8.bin"    \
                   "$ASSETS/qwen2_5_1_5b_q8.bin"; do
            name=$(basename "$f")
            if [ -f "$f" ]; then
              echo "  BUNDLED   $name  ($(du -sh $f | cut -f1))"
            else
              echo "  MISSING   $name"
            fi
          done

      # ── 11. Gradle cache ──────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 12. Make gradlew executable ───────────────────────────────
      - name: Make gradlew executable
        run: chmod +x AURIGA/gradlew

      # ── 13. Build all flavour debug APKs ──────────────────────────
      - name: Build debug APKs (all flavours)
        working-directory: AURIGA
        run: ./gradlew assembleNaviDebug assembleSentinelDebug assembleAeroDebug assembleIndustrialDebug --no-daemon --stacktrace

      # ── 14. Upload APKs as workflow artifacts ─────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: auriga-apks-${{ github.run_number }}
          path: AURIGA/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14

      # ── 15. Build summary ─────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## Auriga APK Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundled models" >> $GITHUB_STEP_SUMMARY
          echo "| Model | Status | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|------|" >> $GITHUB_STEP_SUMMARY
          ASSETS="AURIGA/app/src/main/assets"
          for f in "$ASSETS/yolov8n_float32.tflite" "$ASSETS/qwen2_5_0_5b_q8.bin" "$ASSETS/qwen2_5_1_5b_q8.bin"; do
            name=$(basename "$f")
            if [ -f "$f" ]; then
              size=$(du -sh "$f" | cut -f1)
              echo "| $name | ✅ bundled | $size |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | ⚠️ not bundled | — |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK outputs" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          find AURIGA/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            size=$(du -h "$f" | cut -f1)
            name=$(basename "$f")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done || true
