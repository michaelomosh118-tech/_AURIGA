name: Build Auriga APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Python (model downloads + YOLOv8n export) ───────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Cache pip packages ──────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ultralytics-hf-${{ runner.os }}

      # ── 5. Cache downloaded models (keyed by expected SHA-256) ─────
      - name: Cache models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/models-cache
          key: auriga-models-v1-yolo-qwen-gemma

      # ── 6. Install Python deps ─────────────────────────────────────
      - name: Install Python dependencies
        run: pip install ultralytics huggingface_hub --quiet

      # ── 7. Download / export models ────────────────────────────────
      - name: Download and export all models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ASSETS=AURIGA/app/src/main/assets
          CACHE=$ASSETS/models-cache
          mkdir -p $CACHE

          # ── YOLOv8n TFLite ──────────────────────────────────────────
          TARGET_YOLO=$ASSETS/yolov8n_float32.tflite
          CACHE_YOLO=$CACHE/yolov8n_float32.tflite

          if [ -f "$CACHE_YOLO" ]; then
            echo "YOLOv8n: cache hit"
            cp $CACHE_YOLO $TARGET_YOLO
          else
            echo "YOLOv8n: exporting..."
            yolo export model=yolov8n.pt format=tflite imgsz=640 --quiet
            cp yolov8n_saved_model/yolov8n_float32.tflite $TARGET_YOLO
            cp $TARGET_YOLO $CACHE_YOLO
            echo "YOLOv8n: done ($(du -sh $TARGET_YOLO | cut -f1))"
          fi

          # ── Qwen 2.5 0.5B (no login required) ──────────────────────
          TARGET_QWEN=$ASSETS/qwen2_5_0_5b_q8.bin
          CACHE_QWEN=$CACHE/qwen2_5_0_5b_q8.bin

          if [ -f "$CACHE_QWEN" ]; then
            echo "Qwen: cache hit"
            cp $CACHE_QWEN $TARGET_QWEN
          else
            echo "Qwen: downloading 519 MB..."
            python3 - <<'EOF'
          import os
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
            repo_id="litert-community/Qwen2.5-0.5B-Instruct",
            filename="Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.tflite",
            local_dir="/tmp/qwen"
          )
          dest = "AURIGA/app/src/main/assets/qwen2_5_0_5b_q8.bin"
          cache = "AURIGA/app/src/main/assets/models-cache/qwen2_5_0_5b_q8.bin"
          os.rename(path, dest)
          import shutil; shutil.copy(dest, cache)
          print(f"Qwen saved → {dest}  ({os.path.getsize(dest):,} bytes)")
          EOF
          fi

          # ── Gemma 2 2B (requires HF_TOKEN) ─────────────────────────
          TARGET_GEMMA=$ASSETS/gemma2b_q4.bin
          CACHE_GEMMA=$CACHE/gemma2b_q4.bin

          if [ -f "$CACHE_GEMMA" ]; then
            echo "Gemma: cache hit"
            cp $CACHE_GEMMA $TARGET_GEMMA
          else
            echo "Gemma: downloading 2.52 GB..."
            python3 - <<'EOF'
          import os
          from huggingface_hub import login, hf_hub_download
          token = os.environ.get("HF_TOKEN", "")
          if not token:
            raise SystemExit("HF_TOKEN secret is not set — skipping Gemma")
          login(token=token)
          path = hf_hub_download(
            repo_id="litert-community/Gemma2-2B-IT",
            filename="Gemma2-2B-IT_multi-prefill-seq_q8_ekv1280.tflite",
            local_dir="/tmp/gemma"
          )
          dest = "AURIGA/app/src/main/assets/gemma2b_q4.bin"
          cache = "AURIGA/app/src/main/assets/models-cache/gemma2b_q4.bin"
          os.rename(path, dest)
          import shutil; shutil.copy(dest, cache)
          print(f"Gemma saved → {dest}  ({os.path.getsize(dest):,} bytes)")
          EOF
          fi

          echo ""
          echo "── Model inventory ──────────────────────────"
          ls -lh $ASSETS/*.tflite $ASSETS/*.bin 2>/dev/null || echo "(none found)"

      # ── 8. Verify SHA-256 checksums ────────────────────────────────
      - name: Verify model checksums
        run: |
          ASSETS=AURIGA/app/src/main/assets
          OK=true

          check() {
            local file=$1 expected=$2 label=$3
            if [ ! -f "$file" ]; then
              echo "MISSING  $label"
              return
            fi
            actual=$(sha256sum "$file" | awk '{print $1}')
            if [ "$actual" = "$expected" ]; then
              echo "OK       $label"
            else
              echo "MISMATCH $label"
              echo "  expected: $expected"
              echo "  actual:   $actual"
              OK=false
            fi
          }

          check $ASSETS/qwen2_5_0_5b_q8.bin \
            "54806eb754fe80fe6ed42d055ea56099ae0a273a52bda6437290cc00c501000b" \
            "Qwen 2.5 0.5B"

          check $ASSETS/gemma2b_q4.bin \
            "29ff136fd298e611296e10e9b511c86f42d1291b5b8bfc18c42178e733b679a9" \
            "Gemma 2 2B"

          # YOLOv8n hash varies by export date — just confirm it exists
          if [ -f "$ASSETS/yolov8n_float32.tflite" ]; then
            echo "PRESENT  YOLOv8n float32 ($(du -sh $ASSETS/yolov8n_float32.tflite | cut -f1))"
          else
            echo "MISSING  YOLOv8n float32"
            OK=false
          fi

          if [ "$OK" = "false" ]; then
            echo "One or more checksums failed — aborting build"
            exit 1
          fi

      # ── 9. Gradle cache ────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 10. Make gradlew executable ───────────────────────────────
      - name: Make gradlew executable
        run: chmod +x AURIGA/gradlew

      # ── 11. Build all flavour debug APKs ──────────────────────────
      - name: Build debug APKs (all flavours)
        working-directory: AURIGA
        run: ./gradlew assembleNaviDebug assembleSentinelDebug --no-daemon --stacktrace

      # ── 12. Upload APKs as workflow artifacts ─────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: auriga-apks-${{ github.run_number }}
          path: |
            AURIGA/app/build/outputs/apk/navi/debug/*.apk
            AURIGA/app/build/outputs/apk/sentinel/debug/*.apk
          retention-days: 14

      # ── 13. Post build summary ────────────────────────────────────
      - name: Build summary
        run: |
          echo "## Auriga APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          for f in AURIGA/app/build/outputs/apk/**/**/*.apk; do
            size=$(du -sh "$f" | cut -f1)
            name=$(basename "$f")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APKs from the **Artifacts** section of this run." >> $GITHUB_STEP_SUMMARY
