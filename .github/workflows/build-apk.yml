name: Build Auriga APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Python (model downloads + YOLOv8n export) ───────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Cache pip packages ──────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ultralytics-hf-${{ runner.os }}-v2

      # ── 5. Cache model files (keyed by content hashes) ─────────────
      - name: Cache YOLOv8n model
        id: yolo-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/yolov8n_float32.tflite
          key: yolov8n-tflite-fp32-v1

      # Qwen models are no longer cached/bundled — downloaded on first use.

      # ── 6. Install Python deps ─────────────────────────────────────
      - name: Install Python dependencies
        run: pip install ultralytics huggingface_hub --quiet

      # ── 7. Export YOLOv8n (required) ──────────────────────────────
      - name: Export YOLOv8n TFLite model
        if: steps.yolo-cache.outputs.cache-hit != 'true'
        run: |
          DEST="AURIGA/app/src/main/assets/yolov8n_float32.tflite"
          echo "Exporting YOLOv8n to TFLite..."
          yolo export model=yolov8n.pt format=tflite imgsz=640 --quiet
          SRC=$(find yolov8n_saved_model -name "yolov8n_float32.tflite" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::YOLOv8n export failed — tflite not found"
            exit 1
          fi
          cp "$SRC" "$DEST"
          echo "YOLOv8n ready: $(du -sh $DEST | cut -f1)"

      - name: Verify YOLOv8n
        run: |
          f="AURIGA/app/src/main/assets/yolov8n_float32.tflite"
          [ -f "$f" ] || { echo "::error::YOLOv8n missing"; exit 1; }
          echo "YOLOv8n OK: $(du -sh $f | cut -f1)"

      # ── 8. Model inventory summary ────────────────────────────────
      # Qwen 0.5B and 1.5B are no longer bundled in the APK (Option A
      # size reduction: saves ~1.3 GB). Downloaded on first use by the app.
      - name: Model inventory
        run: |
          echo "── Final model inventory ──────────────────────────────"
          ASSETS="AURIGA/app/src/main/assets"
          if [ -f "$ASSETS/yolov8n_float32.tflite" ]; then
            echo "  BUNDLED   yolov8n_float32.tflite  ($(du -sh $ASSETS/yolov8n_float32.tflite | cut -f1))"
          else
            echo "  MISSING   yolov8n_float32.tflite"
          fi
          echo "  ON-DEMAND qwen2_5_0_5b_q8.bin  (~519 MB, downloaded by app on first use)"
          echo "  ON-DEMAND qwen2_5_1_5b_q8.bin  (~800 MB, downloaded by app on first use)"

      # ── 11. Gradle cache ──────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 12. Make gradlew executable ───────────────────────────────
      - name: Make gradlew executable
        run: chmod +x AURIGA/gradlew

      # ── 13. Build all flavour debug APKs ──────────────────────────
      - name: Build debug APKs (all flavours)
        working-directory: AURIGA
        env:
          GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=512m"
        run: ./gradlew assembleNaviDebug assembleSentinelDebug assembleAeroDebug assembleIndustrialDebug --no-daemon --stacktrace

      # ── 14. Upload APKs as workflow artifacts ─────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: auriga-apks-${{ github.run_number }}
          path: AURIGA/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14

      # ── 15. Build summary ─────────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## Auriga APK Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundled models" >> $GITHUB_STEP_SUMMARY
          echo "| Model | Status | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|------|" >> $GITHUB_STEP_SUMMARY
          ASSETS="AURIGA/app/src/main/assets"
          if [ -f "$ASSETS/yolov8n_float32.tflite" ]; then
            echo "| yolov8n_float32.tflite | ✅ bundled | $(du -sh $ASSETS/yolov8n_float32.tflite | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| yolov8n_float32.tflite | ❌ missing | — |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| qwen2_5_0_5b_q8.bin | ⬇️ on-demand (~519 MB) | — |" >> $GITHUB_STEP_SUMMARY
          echo "| qwen2_5_1_5b_q8.bin | ⬇️ on-demand (~800 MB) | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK outputs" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          find AURIGA/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            size=$(du -h "$f" | cut -f1)
            name=$(basename "$f")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done || true
