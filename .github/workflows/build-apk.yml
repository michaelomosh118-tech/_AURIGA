name: Build Auriga APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Python (model downloads + YOLOv8n export) ───────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Cache pip packages ──────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ultralytics-hf-${{ runner.os }}

      # ── 5. Cache downloaded models ─────────────────────────────────
      - name: Cache models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: AURIGA/app/src/main/assets/models-cache
          key: auriga-models-v1-yolo-qwen-gemma

      # ── 6. Install Python deps ─────────────────────────────────────
      - name: Install Python dependencies
        run: pip install ultralytics huggingface_hub --quiet

      # ── 7. Download / export models ────────────────────────────────
      # Qwen and Gemma are optional LLM models — the app loads them
      # reflectively and gracefully falls back when they are absent.
      # Only YOLOv8n is required (powers LocatorActivity).
      # Gemma requires HF_TOKEN; the step is skipped gracefully if absent.
      - name: Download and export all models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ASSETS=AURIGA/app/src/main/assets
          CACHE=$ASSETS/models-cache
          mkdir -p $CACHE

          # ── YOLOv8n TFLite (required) ───────────────────────────────
          TARGET_YOLO=$ASSETS/yolov8n_float32.tflite
          CACHE_YOLO=$CACHE/yolov8n_float32.tflite

          if [ -f "$CACHE_YOLO" ]; then
            echo "YOLOv8n: cache hit"
            cp $CACHE_YOLO $TARGET_YOLO
          else
            echo "YOLOv8n: exporting..."
            yolo export model=yolov8n.pt format=tflite imgsz=640 --quiet
            cp yolov8n_saved_model/yolov8n_float32.tflite $TARGET_YOLO
            cp $TARGET_YOLO $CACHE_YOLO
            echo "YOLOv8n: done ($(du -sh $TARGET_YOLO | cut -f1))"
          fi

          # ── Qwen 2.5 0.5B (optional — no auth required) ────────────
          TARGET_QWEN=$ASSETS/qwen2_5_0_5b_q8.bin
          CACHE_QWEN=$CACHE/qwen2_5_0_5b_q8.bin

          if [ -f "$CACHE_QWEN" ]; then
            echo "Qwen: cache hit"
            cp $CACHE_QWEN $TARGET_QWEN
          else
            echo "Qwen: downloading 519 MB (optional LLM — skipped if network fails)..."
            python3 - <<'EOF' || echo "::warning::Qwen download failed — LLM will be disabled at runtime (non-fatal)"
          import os, sys
          try:
            from huggingface_hub import hf_hub_download
            path = hf_hub_download(
              repo_id="litert-community/Qwen2.5-0.5B-Instruct",
              filename="Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.tflite",
              local_dir="/tmp/qwen"
            )
            dest = "AURIGA/app/src/main/assets/qwen2_5_0_5b_q8.bin"
            cache = "AURIGA/app/src/main/assets/models-cache/qwen2_5_0_5b_q8.bin"
            os.rename(path, dest)
            import shutil; shutil.copy(dest, cache)
            print(f"Qwen saved → {dest}  ({os.path.getsize(dest):,} bytes)")
          except Exception as e:
            print(f"Qwen download skipped: {e}", file=sys.stderr)
            sys.exit(0)
          EOF
          fi

          # ── Gemma 2 2B (optional — requires HF_TOKEN secret) ───────
          TARGET_GEMMA=$ASSETS/gemma2b_q4.bin
          CACHE_GEMMA=$CACHE/gemma2b_q4.bin

          if [ -f "$CACHE_GEMMA" ]; then
            echo "Gemma: cache hit"
            cp $CACHE_GEMMA $TARGET_GEMMA
          else
            HF_TOKEN="${HF_TOKEN:-}"
            if [ -z "$HF_TOKEN" ]; then
              echo "::warning::HF_TOKEN secret not set — Gemma 2 2B will be skipped (LLM falls back to Qwen or rule-based responses)"
            else
              echo "Gemma: downloading 2.52 GB..."
              python3 - <<'EOF' || echo "::warning::Gemma download failed — LLM will fall back to Qwen/rule-based (non-fatal)"
          import os, sys
          try:
            from huggingface_hub import login, hf_hub_download
            token = os.environ.get("HF_TOKEN", "")
            if not token:
              print("HF_TOKEN not available in Python env", file=sys.stderr)
              sys.exit(0)
            login(token=token)
            path = hf_hub_download(
              repo_id="litert-community/Gemma2-2B-IT",
              filename="Gemma2-2B-IT_multi-prefill-seq_q8_ekv1280.tflite",
              local_dir="/tmp/gemma"
            )
            dest = "AURIGA/app/src/main/assets/gemma2b_q4.bin"
            cache = "AURIGA/app/src/main/assets/models-cache/gemma2b_q4.bin"
            os.rename(path, dest)
            import shutil; shutil.copy(dest, cache)
            print(f"Gemma saved → {dest}  ({os.path.getsize(dest):,} bytes)")
          except Exception as e:
            print(f"Gemma download skipped: {e}", file=sys.stderr)
            sys.exit(0)
          EOF
            fi
          fi

          echo ""
          echo "── Model inventory ──────────────────────────"
          ls -lh $ASSETS/*.tflite $ASSETS/*.bin 2>/dev/null || echo "(no large model files present)"

      # ── 8. Verify required model + report optional models ──────────
      # Only YOLOv8n is a hard requirement. Qwen and Gemma are optional
      # on-device LLMs; missing them logs a warning but never fails CI.
      - name: Verify model inventory
        run: |
          ASSETS=AURIGA/app/src/main/assets
          FAIL=false

          # Required
          if [ -f "$ASSETS/yolov8n_float32.tflite" ]; then
            echo "OK       YOLOv8n float32 ($(du -sh $ASSETS/yolov8n_float32.tflite | cut -f1))"
          else
            echo "::error::MISSING yolov8n_float32.tflite — LocatorActivity requires this model"
            FAIL=true
          fi

          # Optional — report but never fail
          if [ -f "$ASSETS/qwen2_5_0_5b_q8.bin" ]; then
            actual=$(sha256sum "$ASSETS/qwen2_5_0_5b_q8.bin" | awk '{print $1}')
            expected="54806eb754fe80fe6ed42d055ea56099ae0a273a52bda6437290cc00c501000b"
            if [ "$actual" = "$expected" ]; then
              echo "OK       Qwen 2.5 0.5B (checksum verified)"
            else
              echo "::warning::Qwen 2.5 0.5B checksum mismatch — model may be a newer version; runtime will attempt to load anyway"
            fi
          else
            echo "::warning::OPTIONAL Qwen 2.5 0.5B not present — MindEngine LLM will be disabled at runtime"
          fi

          if [ -f "$ASSETS/gemma2b_q4.bin" ]; then
            actual=$(sha256sum "$ASSETS/gemma2b_q4.bin" | awk '{print $1}')
            expected="29ff136fd298e611296e10e9b511c86f42d1291b5b8bfc18c42178e733b679a9"
            if [ "$actual" = "$expected" ]; then
              echo "OK       Gemma 2 2B (checksum verified)"
            else
              echo "::warning::Gemma 2 2B checksum mismatch — model may be a newer version; runtime will attempt to load anyway"
            fi
          else
            echo "::warning::OPTIONAL Gemma 2 2B not present — MindEngine will use Qwen or rule-based fallback"
          fi

          if [ "$FAIL" = "true" ]; then
            exit 1
          fi

      # ── 9. Gradle cache ────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 10. Make gradlew executable ───────────────────────────────
      - name: Make gradlew executable
        run: chmod +x AURIGA/gradlew

      # ── 11. Build all flavour debug APKs ──────────────────────────
      - name: Build debug APKs (all flavours)
        working-directory: AURIGA
        run: ./gradlew assembleNaviDebug assembleSentinelDebug assembleAeroDebug assembleIndustrialDebug --no-daemon --stacktrace

      # ── 12. Upload APKs as workflow artifacts ─────────────────────
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: auriga-apks-${{ github.run_number }}
          path: AURIGA/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14

      # ── 13. Post build summary ────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## Auriga APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
          find AURIGA/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            size=$(du -h "$f" | cut -f1)
            name=$(basename "$f")
            echo "| $name | $size |" >> $GITHUB_STEP_SUMMARY
          done || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the APKs from the **Artifacts** section of this run." >> $GITHUB_STEP_SUMMARY
