name: AURIGA Professional Build Engine

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        flavor: [ navi, sentinel, aero, industrial ]
        buildType: [ debug, release ]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Python is always needed — YOLO export uses ultralytics,
    # Qwen downloads use huggingface_hub.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Locate Android Project Root
      id: locate
      run: |
        PROJECT_ROOT="AURIGA"
        if [ ! -f "${PROJECT_ROOT}/gradlew" ]; then
          echo "::error::Expected Gradle wrapper at ${PROJECT_ROOT}/gradlew — not found!"
          exit 1
        fi
        if [ ! -f "${PROJECT_ROOT}/build.gradle" ]; then
          echo "::error::Expected project build.gradle at ${PROJECT_ROOT}/build.gradle — not found!"
          exit 1
        fi
        echo "Android project root: $PROJECT_ROOT"
        echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

    - name: Compute Gradle task + output paths
      id: task
      run: |
        FLAVOR="${{ matrix.flavor }}"
        BUILD_TYPE="${{ matrix.buildType }}"
        FLAVOR_CAP="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
        BUILD_TYPE_CAP="$(echo "${BUILD_TYPE:0:1}" | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"
        echo "gradle_task=assemble${FLAVOR_CAP}${BUILD_TYPE_CAP}" >> "$GITHUB_OUTPUT"
        echo "apk_subdir=${FLAVOR}/${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

    # ── Phase 1: native YOLOv8n Object Locator ──────────────────────
    # Exported from Ultralytics on the runner (~12 MB fp32 TFLite).
    # Cache key bump: -v1 → -v2 to force a fresh export.
    - name: Restore cached YOLOv8n TFLite model
      id: yolo-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.locate.outputs.project_root }}/app/src/main/assets/yolov8n_float32.tflite
        key: yolov8n-tflite-fp32-v1

    - name: Install Python dependencies
      run: |
        # Ultralytics' TFLite exporter requires numpy<2 (numpy 2.x removed
        # private API numpy._no_nep50_warning used by TensorFlow/Keras).
        pip install --quiet --no-cache-dir "numpy<2" ultralytics huggingface_hub

    - name: Export YOLOv8n model (cache miss only)
      if: steps.yolo-cache.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}
      run: |
        echo "::group::Export yolov8n.pt → TFLite (640x640 fp32)"
        yolo export model=yolov8n.pt format=tflite imgsz=640
        echo "::endgroup::"
        DEST="${{ github.workspace }}/${{ steps.locate.outputs.project_root }}/app/src/main/assets/yolov8n_float32.tflite"
        mkdir -p "$(dirname "$DEST")"
        SRC=$(find yolov8n_saved_model -name "yolov8n_float32.tflite" | head -n 1)
        if [ -z "$SRC" ]; then
          echo "::error::Ultralytics export did not produce yolov8n_float32.tflite"
          ls -laR yolov8n_saved_model || true
          exit 1
        fi
        cp "$SRC" "$DEST"
        echo "YOLOv8n exported to: $DEST"

    - name: Verify YOLOv8n model is bundled
      run: |
        DEST="${{ steps.locate.outputs.project_root }}/app/src/main/assets/yolov8n_float32.tflite"
        [ -f "$DEST" ] || { echo "::error::YOLOv8n missing at $DEST"; exit 1; }
        echo "YOLOv8n OK: $(du -sh $DEST | cut -f1)"

    # ── Phase 2: Model inventory summary ────────────────────────────
    # Qwen 0.5B and 1.5B are no longer bundled in the APK (Option A
    # size reduction: saves ~1.3 GB per APK). They are downloaded
    # on first use via ModelDownloadManager inside the app.
    - name: Model inventory
      run: |
        echo "── Model inventory ─────────────────────────────────────"
        ASSETS="${{ steps.locate.outputs.project_root }}/app/src/main/assets"
        if [ -f "$ASSETS/yolov8n_float32.tflite" ]; then
          echo "  BUNDLED   yolov8n_float32.tflite  ($(du -sh $ASSETS/yolov8n_float32.tflite | cut -f1))"
        else
          echo "  MISSING   yolov8n_float32.tflite"
        fi
        echo "  ON-DEMAND qwen2_5_0_5b_q8.bin  (~519 MB, downloaded by app on first use)"
        echo "  ON-DEMAND qwen2_5_1_5b_q8.bin  (~800 MB, downloaded by app on first use)"

    # ── Phase 5: Build ───────────────────────────────────────────────
    - name: Build ${{ matrix.flavor }} ${{ matrix.buildType }} APK
      working-directory: ${{ steps.locate.outputs.project_root }}
      env:
        GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=512m"
      run: |
        chmod +x ./gradlew
        ./gradlew --no-daemon ${{ steps.task.outputs.gradle_task }}

    - name: Verify APK Signing
      working-directory: ${{ steps.locate.outputs.project_root }}
      run: |
        APK=$(find "app/build/outputs/apk/${{ steps.task.outputs.apk_subdir }}" -name "*.apk" | head -n 1)
        echo "APK: $APK"
        ls -la "$APK"
        BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
        echo "Using build-tools at: $BUILD_TOOLS"
        "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

    - name: Upload ${{ matrix.flavor }} ${{ matrix.buildType }} APK
      uses: actions/upload-artifact@v4
      with:
        name: AURIGA-${{ matrix.flavor }}-${{ matrix.buildType }}-APK
        path: "**/app/build/outputs/apk/${{ steps.task.outputs.apk_subdir }}/app-*.apk"
        retention-days: 14
        if-no-files-found: error

    # ── Phase 6: Build summary ───────────────────────────────────────
    - name: Build summary
      if: always()
      run: |
        echo "## AURIGA ${{ matrix.flavor }} ${{ matrix.buildType }} — Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Models" >> $GITHUB_STEP_SUMMARY
        echo "| Model | Status | Size |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|------|" >> $GITHUB_STEP_SUMMARY
        ASSETS="${{ steps.locate.outputs.project_root }}/app/src/main/assets"
        if [ -f "$ASSETS/yolov8n_float32.tflite" ]; then
          echo "| yolov8n_float32.tflite | ✅ bundled | $(du -sh $ASSETS/yolov8n_float32.tflite | cut -f1) |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| yolov8n_float32.tflite | ❌ missing | — |" >> $GITHUB_STEP_SUMMARY
        fi
        echo "| qwen2_5_0_5b_q8.bin | ⬇️ on-demand (~519 MB) | — |" >> $GITHUB_STEP_SUMMARY
        echo "| qwen2_5_1_5b_q8.bin | ⬇️ on-demand (~800 MB) | — |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### APK output" >> $GITHUB_STEP_SUMMARY
        find AURIGA/app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
          echo "| $(basename $f) | $(du -h $f | cut -f1) |" >> $GITHUB_STEP_SUMMARY
        done || true
